<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#dots)"/>

  <!-- Left: brand + copy -->
  <g transform="translate(72, 88)">
    <rect width="56" height="56" rx="14" fill="#ffffff"/>
    <text x="28" y="39" font-size="30" font-weight="700" fill="#4f46e5" text-anchor="middle">g</text>

    <text x="76" y="26" font-size="34" font-weight="800" fill="#ffffff">NPC Brain</text>
    <text x="76" y="52" font-size="16" font-weight="500" fill="#c7d2fe">Enterprise knowledge assistant · RAG on LINE &amp; Web</text>

    <text x="0" y="118" font-size="26" font-weight="700" fill="#ffffff">Ask your company anything —</text>
    <text x="0" y="152" font-size="26" font-weight="700" fill="#ffffff">answered from internal docs, <tspan fill="#a5b4fc">with citations.</tspan></text>

    <!-- badges -->
    <g transform="translate(0, 186)" font-size="14" font-weight="600" fill="#e0e7ff">
      <g>
        <rect width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
        <text x="75" y="22" text-anchor="middle">Next.js 16 · TS</text>
      </g>
      <g transform="translate(162,0)">
        <rect width="178" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
        <text x="89" y="22" text-anchor="middle">Supabase · pgvector</text>
      </g>
      <g transform="translate(352,0)">
        <rect width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/>
        <text x="98" y="22" text-anchor="middle">OpenRouter · Claude</text>
      </g>
    </g>
  </g>

</svg>
